[project]
name = "payment-processing-service"
version = "2026.1"
description = "Asynchronous payment processing microservice with outbox pattern, RabbitMQ and webhooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.142.2",
    "faststream[cli,rabbit]==0.7.7",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.3",
    "tenacity==9.1.4",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false
add-bounds = "exact"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "testcontainers==4.15.0",
    "vulture==2.16",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "webhook_mock", "order_generator", "tests", "db_migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "C4", "SIM", "RET",
    "ARG", "PTH", "DTZ", "T20", "PT", "RUF", "PL", "TRY", "PERF", "FAST",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "webhook_mock", "order_generator", "db_migrations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "webhook_mock", "order_generator", "tests", "db_migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.vulture]
paths = ["src", "webhook_mock", "order_generator", "db_migrations"]
min_confidence = 70
ignore_names = ["requeue", "cls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["e2e: tests against a real RabbitMQ container (requires Docker)"]
